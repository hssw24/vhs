<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">

    <!-- Optimale Darstellung auf Handy -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Buttonmatrix</title>

    <style>

        /* =====================================================
           GRUNDEINSTELLUNGEN
           ===================================================== */

        body {
            margin: 0;
            padding: 15px;
            font-family: Arial, sans-serif;
            background: #f2f2f2;
        }

        h1 {
            text-align: center;
            margin-bottom: 20px;
        }


        /* =====================================================
           BUTTONMATRIX
           ===================================================== */

        #buttonMatrix {
            display: grid;

            /*
             * Die Anzahl der Spalten passt sich
             * automatisch an die Bildschirmbreite an.
             */
            grid-template-columns:
                repeat(auto-fit, minmax(140px, 1fr));

            gap: 12px;

            max-width: 900px;
            margin: 0 auto;
        }


        /* =====================================================
           BUTTON
           ===================================================== */

        .matrixButton {
            position: relative;

            width: 100%;
            min-height: 80px;

            padding: 0;

            background: white;
            color: #222;

            border: 2px solid #1976d2;
            border-radius: 10px;

            overflow: hidden;

            cursor: pointer;

            transition: transform 0.1s;
        }

        .matrixButton:active {
            transform: scale(0.96);
        }


        /* =====================================================
           BILDER AUF DEN BUTTONS
           ===================================================== */

        .buttonImage {
            display: block;

            width: 100%;
            height: auto;

            /*
             * Das Bild passt sich automatisch
             * an die Buttonbreite an.
             */
        }


        /* Beschriftung unter dem Bild */
        .buttonText {
            display: block;

            padding: 10px;

            font-size: 16px;
            font-weight: bold;
        }


        /* =====================================================
           VOLLbild-OVERLAY
           ===================================================== */

        #imageOverlay {

            /* zunächst unsichtbar */
            display: none;

            /*
             * Überdeckt den kompletten Bildschirm
             */
            position: fixed;

            left: 0;
            top: 0;

            width: 100vw;
            height: 100vh;

            background: rgba(0, 0, 0, 0.92);

            /*
             * Bild und Schließen-Button
             * über allem anderen anzeigen
             */
            z-index: 9999;

            /*
             * Bild mittig platzieren
             */
            align-items: center;
            justify-content: center;

            padding: 10px;

            box-sizing: border-box;
        }


        /* =====================================================
           VERGRÖSSERTES BILD
           ===================================================== */

        #fullImage {

            /*
             * Das Bild darf maximal die
             * Bildschirmgröße einnehmen.
             */
            max-width: 100%;
            max-height: 100%;

            width: auto;
            height: auto;

            object-fit: contain;
        }


        /* =====================================================
           SCHLIESSEN-BUTTON
           ===================================================== */

        #closeButton {

            position: absolute;

            top: 10px;
            right: 15px;

            width: 45px;
            height: 45px;

            border: none;
            border-radius: 50%;

            background: rgba(255, 255, 255, 0.85);

            color: #222;

            font-size: 30px;
            line-height: 45px;

            cursor: pointer;

            z-index: 10000;
        }


        /* =====================================================
           KLEINE HANDYS
           ===================================================== */

        @media (max-width: 400px) {

            body {
                padding: 10px;
            }

            #buttonMatrix {
                grid-template-columns: repeat(2, 1fr);
                gap: 8px;
            }

            .buttonText {
                font-size: 14px;
                padding: 8px;
            }

        }

    </style>
</head>


<body>

    <h1>Meine Buttonmatrix</h1>


    <!-- =====================================================
         BUTTONMATRIX

         Die Buttons werden automatisch erzeugt.
         ===================================================== -->

    <div id="buttonMatrix"></div>


    <!-- =====================================================
         VOLLbild-ANSICHT

         Dieser Bereich wird erst beim Antippen eines
         Bildes sichtbar.
         ===================================================== -->

    <div id="imageOverlay">

        <!-- Schließen -->
        <button id="closeButton">&times;</button>

        <!-- Großes Bild -->
        <img id="fullImage" src="" alt="Vergrößertes Bild">

    </div>


    <script>


        /* =====================================================
           HIER BUTTONS EINTRAGEN / ÄNDERN
           =====================================================

           text  = Beschriftung des Buttons

           link  = Webseite, die beim normalen Antippen
                   des Buttons geöffnet wird

           image = Bild, das auf dem Button angezeigt wird

           Wenn kein Bild vorhanden ist:
           image: ""

           ===================================================== */

        const buttons = [

            {
                text: "1 Elektromotor ohne Kommutator - Animation",
                link: "https://vhs-sepia.vercel.app/emo.html",
                image: ""
            },

            {
                text: "2 Elektromotor ohne Kommutator - Bild 1",
                link: "https://vhs-sepia.vercel.app/emok1.jpg",
                image: "https://vhs-sepia.vercel.app/emok1.jpg"

            },

            {
                text: "2 Elektromotor ohne Kommutator - Bild 2",
                link: "https://vhs-sepia.vercel.app/emok2.jpg",
                image: "https://vhs-sepia.vercel.app/emok2.jpg"

            },

            {
                text: "Bild 2",
                link: "https://www.beispiel.de",
                image: "bilder/bild2.jpg"
            },

            {
                text: "Bild 3",
                link: "https://www.beispiel.de",
                image: "bilder/bild3.jpg"
            },

            {
                text: "YouTube",
                link: "https://www.youtube.com",
                image: ""
            }

        ];


        /* =====================================================
           ELEMENTE AUS HTML HOLEN
           ===================================================== */

        const matrix =
            document.getElementById("buttonMatrix");

        const overlay =
            document.getElementById("imageOverlay");

        const fullImage =
            document.getElementById("fullImage");

        const closeButton =
            document.getElementById("closeButton");


        /* =====================================================
           BUTTONS ERZEUGEN
           ===================================================== */

        buttons.forEach(button => {

            /*
             * Button erstellen
             */
            const element =
                document.createElement("button");

            element.className = "matrixButton";


            /*
             * Wenn ein Bild angegeben wurde,
             * Bild auf dem Button anzeigen.
             */
            if (button.image !== "") {

                const image =
                    document.createElement("img");

                image.src = button.image;

                image.className =
                    "buttonImage";

                image.alt = button.text;


                /*
                 * Bild antippen:
                 * Vollbild öffnen.
                 */
                image.addEventListener("click", (event) => {

                    /*
                     * Verhindert, dass gleichzeitig
                     * der Button-Link ausgelöst wird.
                     */
                    event.stopPropagation();

                    fullImage.src = button.image;

                    overlay.style.display = "flex";

                });


                element.appendChild(image);
            }


            /*
             * Beschriftung
             */
            const text =
                document.createElement("span");

            text.className = "buttonText";

            text.textContent =
                button.text;

            element.appendChild(text);


            /*
             * Button anklicken:
             * Link öffnen.
             */
            element.addEventListener("click", () => {

                if (button.link !== "") {

                    window.location.href =
                        button.link;

                }

            });


            /*
             * Button in Matrix einfügen
             */
            matrix.appendChild(element);

        });


        /* =====================================================
           VOLLbild SCHLIESSEN
           ===================================================== */

        function closeImage() {

            overlay.style.display = "none";

            /*
             * Bildquelle löschen.
             */
            fullImage.src = "";

        }


        /*
         * X-Button
         */
        closeButton.addEventListener(
            "click",
            closeImage
        );


        /*
         * Auch beim Antippen des dunklen Bereichs
         * wird das Bild geschlossen.
         */
        overlay.addEventListener("click", (event) => {

            if (event.target === overlay) {

                closeImage();

            }

        });


        /*
         * ESC-Taste am PC
         */
        document.addEventListener("keydown", (event) => {

            if (event.key === "Escape") {

                closeImage();

            }

        });


    </script>

</body>
</html>
